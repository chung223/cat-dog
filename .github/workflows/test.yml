name: Test

on:
  pull_request:
  push:
    branches-ignore: [claude/game-redevelopment-mfaf56]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify every level has exactly one solution
        run: node tools/verify-levels.mjs
